name: Fetch forecasts

on:
  schedule:
    # 12:10 UTC = 5:10 AM PDT / 4:10 AM PST. GitHub cron is always UTC.
    - cron: "10 12 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

# The built-in token may only write repository contents. Nothing else.
permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch model data
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update forecast data"
            git push
          fi
